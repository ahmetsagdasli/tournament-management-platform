name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tournament_user
          POSTGRES_PASSWORD: tournament_password
          POSTGRES_DB: tournament_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tournament_user -d tournament_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgres://tournament_user:tournament_password@localhost:5432/tournament_test
      TEST_DATABASE_URL: postgres://tournament_user:tournament_password@localhost:5432/tournament_test
      JWT_SECRET: ci-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
      BCRYPT_COST: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
